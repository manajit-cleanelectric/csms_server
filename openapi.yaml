openapi: 3.0.4
info:
  title: Charging Infrastructure API
  description: |-
    This API enables management of users, chargers, vehicles, sessions, payments, and other core operations for 
    EV infrastructure.
    Field types and enumerations are standardized to match the database schema.
    All decimal, numeric, and bigint fields are represented as `string` in the API.
    For details, refer to the attached API and data type docs.
  termsOfService: 'https://example.com/terms/'
  contact:
    email: api-support@example.com
  license:
    name: Proprietary Internal Use
    url: 'https://example.com/license'
  version: 1.0.0
externalDocs:
  description: API Docs
  url: 'https://example.com/docs'
servers:
  - url: 'https://dev.cpo.cehive.com'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        line1:
          type: string
        line2:
          type: string
        location:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        phoneNumber:
          type: string
          description: Phone number
        firstName:
          type: string
          nullable: true
          description: First name
        lastName:
          type: string
          nullable: true
          description: Last name
        city:
          type: string
          nullable: true
          description: City
        state:
          type: string
          nullable: true
          description: State
        email:
          type: string
          nullable: true
          description: Email
        isEmailVerified:
          type: boolean
          description: Email verified status
        isAccountApproved:
          type: boolean
          description: Account approval status
        isProfileComplete:
          type: boolean
          description: Profile completion status
        isVehicleRegistered:
          type: boolean
          description: Vehicle registration status
        isActive:
          type: boolean
          description: Active status
        isDeleted:
          type: boolean
          description: Deleted status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    UserCompact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phoneNumber:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          type: string
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Vehicle ID
        user:
          type: string
          format: uuid
          nullable: true
          description: User ID
        model:
          type: string
          nullable: true
          description: Vehicle model
        vendor:
          type: string
          nullable: true
          description: Vehicle vendor
        vin:
          type: string
          description: Vehicle Identification Number
        bin:
          type: string
          nullable: true
          description: BIN
        vehicleNo:
          type: string
          nullable: true
          description: Vehicle number
        rcNumber:
          type: string
          nullable: true
          description: RC number
        isApproved:
          type: boolean
          description: Approval status
        rcImageUrl:
          type: string
          nullable: true
          description: RC image URL
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    Charger:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Charger ID
        model:
          type: string
          description: Charger model
        vendor:
          type: string
          description: Charger vendor
        serialNumber:
          type: string
          description: Serial number
        maxPower:
          type: number
          description: Maximum power in kW
        alias:
          type: string
          nullable: true
          description: Charger alias
        city:
          type: string
          description: City location
        address:
          $ref: '#/components/schemas/Address'
        noOfConnector:
          type: number
          description: Number of connectors
        latitude:
          type: string
          description: Latitude coordinates
        longitude:
          type: string
          description: Longitude coordinates
        status:
          type: string
          enum:
            - Available
            - Occupied
            - Faulted
            - Unavailable
          description: Charger status
        tariff:
          $ref: '#/components/schemas/Tariff'
        lastHeartBeat:
          type: string
          format: date-time
          nullable: true
          description: Last heartbeat
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    ChargerCompact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        model:
          type: string
        vendor:
          type: string
        serialNumber:
          type: string
        city:
          type: string
        alias:
          type: string
        maxPower:
          type: number
          format: integer
        noOfConnector:
          type: number
        tariff:
          $ref: '#/components/schemas/Tariff'
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
    Connector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chargerConnectorId:
          type: number
          format: integer
        type:
          type: string
          enum:
            - TYPE_2_AC
            - CCS2_DC
            - CHADEMO_DC
            - TYPE_1_AC
            - TYPE_6_DC
            - TYPE_7_ACDC
            - BHARAT_AC001
            - BHARAT_DC001
            - GBT_AC
            - GBT_DC
            - PANTOGRAPH_DOWN
            - PANTOGRAPH_UP
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Order ID
        user:
          $ref: '#/components/schemas/UserCompact'
        orderId:
          type: string
        amount:
          type: string
          description: Payment amount
        currency:
          type: string
          description: Currency code
        status:
          type: string
          enum:
            - initialised
            - pending
            - complete
            - failed
          description: Payment status
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    Session:
      type: object
      properties:
        id:
          type: integer
          description: Session ID
        charger:
          $ref: '#/components/schemas/ChargerCompact'
        connector:
          $ref: '#/components/schemas/Connector'
        vehicleNo:
          type: string
          nullable: true
          description: Vehicle number
        vehicleVendor:
          type: string
          nullable: true
          description: Vehicle vendor
        vehicleModel:
          type: string
          nullable: true
          description: Vehicle model
        user:
          $ref: '#/components/schemas/UserCompact'
        startTime:
          type: string
          format: date-time
          description: Session start time
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Session end time
        meterStart:
          type: string
          nullable: true
          description: Starting meter reading
        meterStop:
          type: string
          nullable: true
          description: Ending meter reading
        energyUsed:
          type: number
          nullable: true
          description: Energy consumed
        location:
          type: string
          nullable: true
          description: Location
        socStart:
          type: number
          nullable: true
          description: Starting State of Charge
        socLast:
          type: number
          nullable: true
          description: Last State of Charge
        reason:
          type: string
          nullable: true
          description: Session end reason
        status:
          type: string
          enum:
            - Preparing
            - Charging
            - SuspendedEVSE
            - SuspendedEV
            - Finishing
          description: Session status
        baseAmount:
          type: string
          nullable: true
          description: Base amount
        netCGST:
          type: string
          nullable: true
          description: CGST amount
        netSGST:
          type: string
          nullable: true
          description: SGST amount
        netIGST:
          type: string
          nullable: true
          description: IGST amount
        totalAmount:
          type: string
          nullable: true
          description: Total amount
        transaction:
          type: string
          format: uuid
          nullable: true
          description: Transaction ID
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    SessionCompact:
      type: object
      properties:
        id:
          type: integer
          description: 'Session ID'
        charger:
          $ref: '#/components/schemas/ChargerCompact'
        location:
          type: string
          nullable: true
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        energyUsed:
          type: number
          format: integer
          nullable: true
        status:
          type: string
        totalAmount:
          type: string
          description: numeric as string
          nullable: true
    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Wallet ID
        user:
          $ref: '#/components/schemas/UserCompact'
        type:
          type: string
          enum:
            - Customer
            - System
          description: Wallet type
        currency:
          type: string
          description: Currency code
        code:
          type: string
          description: Wallet code
        balance:
          type: string
          description: Current balance
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Update timestamp
    WalletCompact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: 'Wallet ID'
        balance:
          type: string
          description: numeric as string
    Tariff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pricePerKWh:
          type: string
          description: numeric as string
        CGST:
          type: string
          description: numeric as string
        SGST:
          type: string
          description: numeric as string
        IGST:
          type: string
          description: numeric as string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the user
    vehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the vehicle
    chargerId:
      name: chargerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the charger
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
      description: ID of the session
  requestBodies:
    OTPRequestBody:
      description: Request body for sending OTP
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              phoneNumber:
                type: string
                description: Phone number
            required:
              - phoneNumber
    LoginRequestBody:
      description: Request body for user login
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              phoneNumber:
                type: string
                description: Phone number
              otp:
                type: string
                description: OTP code
            required:
              - phoneNumber
              - otp
  responses:
    GeneralSuccess:
      description: General success response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Operation completed successfully
              data:
                type: object
                example: null
            required:
              - success
              - message
    LoginSuccess:
      description: Successful login response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: Logged user successfully
              accessToken:
                type: string
                description: JWT access token
              refreshToken:
                type: string
                description: JWT refresh token
              data:
                $ref: '#/components/schemas/User'
    UnauthorizedError:
      description: Authentication is required and has failed or has not yet been provided
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Unauthorized: Invalid or missing token'
              data:
                type: object
                example: null
    ForbiddenError:
      description: You do not have permission to access this resource
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Forbidden: Access denied'
              data:
                type: object
                example: null
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Resource not found'
              data:
                type: object
                example: null
    AlreadyExistsError:
      description: The resource already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Resource already exists'
              data:
                type: object
                example: null
    BadRequestError:
      description: The request was invalid or cannot be served
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'Missing required parameter: phoneNumber'
              data:
                type: object
                example: null
    InternalServerError:
      description: An unexpected error occurred on the server
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: 'An unexpected error occurred. Please try again later.'
              data:
                type: object
                example: null
paths:
  /api/auth/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP to phone number
      description: Sends an OTP code to the provided phone number for authentication
      requestBody:
        $ref: '#/components/requestBodies/OTPRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/GeneralSuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login with phone number and OTP
      description: Authenticates user with phone number and OTP, returns JWT tokens
      requestBody:
        $ref: '#/components/requestBodies/LoginRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccess'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Logs out the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GeneralSuccess'
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Refreshes the access token using refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Token refreshed successfully'
                  accessToken:
                    type: string
                    description: New JWT access token
                  data:
                    type: object
                    example: null
                required:
                  - success
                  - message
                  - accessToken
  /api/users:
    get:
      tags:
        - User Management
      summary: List all customers
      description: Retrieves a list of all customers (supervisor only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/users/{userId}/approve:
    get:
      tags:
        - User Management
      summary: Approve user account
      description: Approves a user account (supervisor only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          $ref: '#/components/responses/GeneralSuccess'
  /api/users/me:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Retrieves the profile of the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User details fetched'
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags:
        - User Profile
      summary: Update user profile
      description: Updates the profile information of the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                city:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Profile updated successfully'
                  data:
                    $ref: '#/components/schemas/User'
    post:
      tags:
        - User Profile
      summary: Create or update user account info
      description: Creates or updates user account information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                city:
                  type: string
                state:
                  type: string
              required:
                - firstName
                - lastName
      responses:
        '200':
          description: Account info updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Account info updated successfully'
                  data:
                    $ref: '#/components/schemas/User'
  /api/users/{userId}/vehicles:
    get:
      tags:
        - Vehicles
      summary: Get user vehicles
      description: Retrieves all vehicles for a specific user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Vehicles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vehicle'
    post:
      tags:
        - Vehicles
      summary: Add vehicle to user
      description: Adds a new vehicle for the user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                vendor:
                  type: string
                vin:
                  type: string
                vehicleNo:
                  type: string
                rcNumber:
                  type: string
              required:
                - vin
      responses:
        '201':
          description: Vehicle added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Vehicle added successfully'
                  data:
                    $ref: '#/components/schemas/Vehicle'
  /api/vehicles/{vehicleId}:
    get:
      tags:
        - Vehicles
      summary: Get vehicle by ID
      description: Retrieves a specific vehicle by its ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/vehicleId'
      responses:
        '200':
          description: Vehicle retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Vehicles
      summary: Update vehicle
      description: Updates vehicle information
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/vehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                vendor:
                  type: string
                vehicleNo:
                  type: string
                rcNumber:
                  type: string
      responses:
        '200':
          description: Vehicle updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Vehicle updated successfully'
                  data:
                    $ref: '#/components/schemas/Vehicle'
    patch:
      tags:
        - Vehicles
      summary: Partially update vehicle
      description: Updates specific fields of a vehicle
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/vehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                vendor:
                  type: string
                vehicleNo:
                  type: string
                rcNumber:
                  type: string
                isApproved:
                  type: boolean
      responses:
        '200':
          description: Vehicle updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Vehicle updated successfully'
                  data:
                    $ref: '#/components/schemas/Vehicle'
  /api/chargers:
    get:
      tags:
        - Chargers
      summary: Get all chargers
      description: Retrieves a list of all available chargers
      security:
        - BearerAuth: []
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter by city
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - Available
              - Occupied
              - Faulted
              - Unavailable
          description: Filter by charger status
      responses:
        '200':
          description: Chargers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Charger'
    post:
      tags:
        - Chargers
      summary: Create new charger
      description: Creates a new charger (admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                vendor:
                  type: string
                serialNumber:
                  type: string
                maxPower:
                  type: number
                alias:
                  type: string
                city:
                  type: string
                noOfConnector:
                  type: number
                latitude:
                  type: string
                longitude:
                  type: string
              required:
                - model
                - vendor
                - serialNumber
                - maxPower
                - city
                - noOfConnector
                - latitude
                - longitude
      responses:
        '201':
